plugins {
    id 'java'
    id 'run.halo.plugin.devtools' version '0.8.0'
    id 'io.freefair.lombok' version '8.14.4'
}

group 'run.halo.codeenhance'
version '2.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url 'https://s01.oss.sonatype.org/content/repositories/releases' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://repo.spring.io/milestone' }
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.27.1')
    compileOnly 'run.halo.app:api'
    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

halo {
    version = '2.27'
    superAdminUsername = 'admin'
    superAdminPassword = 'admin'
    port = 8090
    externalUrl = 'http://localhost:8090'
}

/**
 * 发布归档：把当前版本的 JAR 复制到 版本管理/。
 * 版本号取自 build.gradle 的 version，避免手工拷贝时命名不一致。
 * 用法：./gradlew archiveRelease
 */
tasks.register('archiveRelease', Copy) {
    group = 'halo plugin'
    description = '归档当前版本的插件 JAR 到 版本管理/'
    dependsOn tasks.named('build')
    from layout.buildDirectory.dir('libs')
    include "plugin-codeenhance-${version}.jar"
    into layout.projectDirectory.dir('版本管理')
}
